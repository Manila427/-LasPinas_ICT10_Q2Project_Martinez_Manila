
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Quarter 2 Seatwork 1</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: rgb(184, 211, 218);
            color: white;
            padding: 20px;
        }

        header h1 {
            font-family: Arial, sans-serif;
            margin: 10px;
        }

        header p {
            font-size: 16px;
        }

        .reactor {
            width: 35px;
            height: 35px;
            background-color: lightblue;
            border: 3px solid white;
            border-radius: 50%;
            margin: auto;
        }

        main {
            background-color: white;
            width: 350px;
            max-width: 85%;
            margin: 40px auto;
            padding: 25px;
            border: 2px solid rgb(153, 243, 249);
            border-radius: 10px;
        }

        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid gray;
            border-radius: 5px;
        }

        input[type="button"] {
            background-color: rgb(170, 255, 255);
            color: white;
            padding: 10px 25px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: rgb(0, 68, 128);
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            color: rgb(180, 180, 255);
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <header>
        <div class="reactor"></div>
        <h1>Glee Club</h1>
        <p>This club is for those who love to sing and perform</p>
    </header>

    <main>
        <form>
            <input type="text" id="first_name" placeholder="Enter your First Name">
            

            <input type="text" id="last_name" placeholder="Enter your Last Name">
                       <input type="button" id="checkMember" value="Enter">
    

        <div id="result"></div>

        <a class="back-link" href="index.html">Back to Home</a>
        
            </form>
    </main>
<script type="py" src="./club.py"></script>
</body>
</html>
